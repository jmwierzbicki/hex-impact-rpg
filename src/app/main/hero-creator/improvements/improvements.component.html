<div class="box">
  <h3>Improvements:</h3>
  <div class="block content is-medium">
    <div
      *ngFor="let improvement of deck.improvements; index as i"
      class="block"
    >
      <div class="field">
        <label class="is-clickable">
          <input
            [formControl]="formArray.at(i)"
            class="checkbox"
            type="checkbox"
          >
          {{ improvement.description }}
        </label>


      </div>

    </div>
  </div>

</div>
